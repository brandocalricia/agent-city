<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent City</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f1a">
<meta name="description" content="Agent City: a top-down office where AI agents live and work for the owner.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/office.css">
<script src="data.js"></script>
<script>
  // private.js (gitignored) only exists on the local copy; never requested on the public site.
  if ((location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) && !/[?&]public\b/.test(location.search))
    document.write('<script src="private.js" onerror="void 0"><\/script>');
</script>
<script src="js/manifest.js"></script>
</head>
<body>
<div id="app" class="office-root"></div>

<div id="toasts" aria-live="polite"></div>

<div id="err"><div id="errMsg"></div></div>

<script>
  function cityError(msg) {
    var e = document.getElementById('err');
    e.style.display = 'flex';
    document.getElementById('errMsg').innerHTML = '<h2>Agent City hit a snag</h2><p>' + msg + '</p>';
  }
  setTimeout(function () {
    if (!window.__cityStarted) cityError('Could not load the city. Check your connection and reload.');
  }, 15000);
</script>
<script>
  (function () {
    window.__cityStarted = true;
    window.addEventListener('error', e => cityError(String(e.message || e)));
    const bust = location.protocol === 'file:' ? '' : '?v=' + City.version;
    (async () => {
      for (const f of City.files) await new Promise((ok, bad) => {
        const s = document.createElement('script');
        s.src = f + bust;
        s.onload = () => ok();
        s.onerror = () => bad(new Error('Could not load ' + f));
        document.body.appendChild(s);
      });
      // City.main() is now City.office.init() called automatically by office.js
    })().catch(e => cityError(e.message));
  })();
</script>
</body>
</html>
